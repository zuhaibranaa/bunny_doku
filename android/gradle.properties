# Keep the Gradle heap within this machine's limits. The Flutter template default
# (-Xmx8G + 4G metaspace) gets OOM-killed here, so the release build dies with
# "Gradle build daemon disappeared unexpectedly".
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=false
org.gradle.workers.max=2
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
