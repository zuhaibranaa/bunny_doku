name: bunny_doku
description: "Rabbit-themed Sudoku variant puzzle game with Candy Crush-style stage selection."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  provider: ^6.1.2

  # Local storage
  shared_preferences: ^2.3.3

  # Networking (remote stage packs)
  http: ^1.3.0

  # Ads (AdMob)
  google_mobile_ads: 5.2.0

  # In-App Purchases (boosters, remove ads)
  in_app_purchase: ^3.1.13

  # Date formatting
  intl: ^0.19.0

  # SVG assets
  flutter_svg: ^2.0.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/stages/
    - assets/images/
    - assets/images/rabbit/
    - assets/images/regions/
    - assets/images/booster/
    - assets/images/map/
    - assets/fonts/
